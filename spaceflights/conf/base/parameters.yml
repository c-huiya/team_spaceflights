target_column: repeat_buyer

# Train/test split configuration (70% train / 30% test)
train_fraction: 0.7
random_state: 42

# Random-search hyperparameters
param_dist:
  n_estimators: !!python/range [50, 201]  # range from 50 to 200
  learning_rate: !!python/object/apply:scipy.stats.uniform
    args: [0.01, 0.3]  # draws from uniform(0.01, 0.31)

# Number of iterations for RandomizedSearchCV
n_iter: 20

# folds for cross-validation
cv: 5

# metric optimized (f1)
scoring: "f1"
