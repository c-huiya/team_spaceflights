target_column: repeat_buyer

# Train/test split configuration (70% train / 30% test)
train_fraction: 0.7
random_state: 42

# Grid-search hyperparameters
param_grid:
  n_estimators: [50, 100, 150]
  learning_rate: [0.002, 0.02, 0.2]

# folds for cross-validation?
cv: 5

# metric optimized (f1)
scoring: "f1"
